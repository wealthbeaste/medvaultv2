<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MedVault — Bar Ordering</title>
<style>
  :root { --bg:#0b0f14; --s1:#131a22; --border:#232c37; --text:#e8edf2; --muted:#8b98a5; --accent:#3aa6ff; --good:#2ecc71; --warn:#f5a623; --bad:#e74c3c; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,Segoe UI,Roboto,sans-serif; padding:20px; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:13px; margin-bottom:20px; }
  .msg { font-size:13px; color:var(--warn); background:rgba(245,166,35,.1); border:1px solid rgba(245,166,35,.3); padding:10px 12px; border-radius:8px; margin-bottom:16px; }
  .msg.good { color:var(--good); background:rgba(46,204,113,.1); border-color:rgba(46,204,113,.3); }
  .msg.bad { color:var(--bad); background:rgba(231,76,60,.1); border-color:rgba(231,76,60,.3); }
  .msg.locked { color:var(--muted); background:var(--s1); border-color:var(--border); }
  a.login-link { color:var(--accent); }
  .bar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:16px; }
  .bar button { background:var(--accent); border:none; color:#04101c; font-weight:600; padding:9px 16px; border-radius:8px; cursor:pointer; font-size:13px; }
  .bar button.secondary { background:transparent; border:1px solid var(--border); color:var(--text); }
  .bar button.danger { background:var(--bad); color:#fff; }
  .bar button:disabled { opacity:.5; cursor:default; }
  .layout { display:grid; grid-template-columns:1fr; gap:20px; }
  @media (min-width:900px) { .layout { grid-template-columns: 1.1fr 1fr; align-items:start; } }
  .card { background:var(--s1); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:16px; }
  .section-title { font-size:14px; font-weight:700; margin:0 0 12px; }
  .tables-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:10px; }
  .table-tile { border:1px solid var(--border); border-radius:10px; padding:12px 10px; text-align:center; cursor:pointer; background:var(--bg); transition:border-color .15s; }
  .table-tile:hover { border-color:var(--accent); }
  .table-tile.selected { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
  .table-tile .num { font-size:18px; font-weight:700; }
  .table-tile .cap { font-size:11px; color:var(--muted); }
  .table-tile .status { font-size:10px; font-weight:600; margin-top:6px; padding:2px 8px; border-radius:20px; display:inline-block; }
  .table-tile .status.available { background:rgba(46,204,113,.15); color:var(--good); }
  .table-tile .status.occupied { background:rgba(245,166,35,.15); color:var(--warn); }
  .new-table-form { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .new-table-form input { background:var(--bg); border:1px solid var(--border); color:var(--text); padding:8px; border-radius:8px; font-size:13px; width:90px; }
  .menu-cat { font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:14px 0 6px; }
  .menu-cat:first-child { margin-top:0; }
  .menu-item { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 0; border-bottom:1px solid var(--border); }
  .menu-item:last-child { border-bottom:none; }
  .menu-item .name { font-size:13px; }
  .menu-item .price { font-size:12px; color:var(--muted); }
  .menu-item .stock-low { color:var(--bad); font-size:11px; }
  .menu-item button { background:var(--accent); border:none; color:#04101c; font-weight:600; padding:6px 12px; border-radius:8px; cursor:pointer; font-size:12px; }
  .order-line { display:flex; justify-content:space-between; font-size:13px; padding:6px 0; border-bottom:1px solid var(--border); }
  .order-line:last-child { border-bottom:none; }
  .order-line .qty { color:var(--muted); margin-right:6px; }
  .total-row { display:flex; justify-content:space-between; font-size:16px; font-weight:700; margin-top:12px; padding-top:12px; border-top:1px solid var(--border); }
  .balance-row { display:flex; justify-content:space-between; font-size:13px; color:var(--muted); margin-top:4px; }
  .balance-row.due { color:var(--warn); }
  .empty-hint { color:var(--muted); font-size:13px; padding:20px 0; text-align:center; }
  .pay-panel { margin-top:14px; padding-top:14px; border-top:1px solid var(--border); }
  .pay-panel .formgrid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px; }
  .pay-panel label { font-size:12px; color:var(--muted); display:flex; flex-direction:column; gap:4px; }
  .pay-panel input, .pay-panel select { background:var(--bg); border:1px solid var(--border); color:var(--text); padding:8px; border-radius:8px; font-size:13px; font-family:inherit; }
  .pay-panel .full { grid-column:1/-1; }
  .change-note { font-size:12px; color:var(--good); margin:-4px 0 8px; }
  .paid-list { margin-top:10px; }
  .paid-list .row { display:flex; justify-content:space-between; font-size:12px; color:var(--muted); padding:4px 0; }
  #barSyncBar { display:none; font-size:12px; font-weight:600; border:1px solid var(--border); border-radius:8px; padding:8px 12px; margin-bottom:14px; }
</style>
</head>
<body>

<a href="./app.html" style="display:inline-block;margin-bottom:10px;color:var(--muted);text-decoration:none;font-size:13px;">← Back to Dashboard</a>
<h1>Bar Ordering</h1>
<div class="sub">Pick a table, add items from the menu, and settle the bill.</div>

<div id="barSyncBar"></div>
<div id="authMsg"></div>

<div id="content" style="display:none;">

  <div class="card">
    <div class="section-title">Tables</div>
    <div class="tables-grid" id="tablesGrid">Loading…</div>
    <div class="new-table-form">
      <input id="newTableNum" placeholder="Table #">
      <input id="newTableCap" placeholder="Seats" value="4">
      <button class="secondary" onclick="createTable()">+ Add table</button>
    </div>
  </div>

  <!-- MANAGE MENU & STOCK (owner/manager/super_admin only — mirrors backend's bar-menu:write) -->
  <div class="card" id="manageMenuCard" style="display:none;">
    <div class="section-title">Manage Menu &amp; Stock</div>
    <div class="new-table-form" style="flex-wrap:wrap;">
      <input id="newItemName" placeholder="Item name" style="width:140px;">
      <input id="newItemCategory" placeholder="Category" style="width:100px;">
      <input id="newItemPrice" placeholder="Price (UGX)" style="width:110px;">
<select id="newItemUnit" style="width:100px;">
        <option value="">Unit…</option>
        <option value="bottle">Bottle</option>
        <option value="shot">Shot</option>
        <option value="can">Can</option>
        <option value="crate">Crate</option>
        <option value="glass">Glass</option>
        <option value="plate">Plate</option>
      </select>
      <input id="newItemCostPrice" placeholder="Cost price (UGX)" style="width:110px;">
      <input id="newItemSupplier" placeholder="Supplier" style="width:120px;">
      <input id="newItemStock" placeholder="Initial stock" value="0" style="width:100px;">
      <input id="newItemLowThreshold" placeholder="Low stock at" value="0" style="width:100px;">
      <button id="menuItemSubmitBtn" onclick="createMenuItem()">+ Add item</button>
    </div>
    <input id="menuStockSearch" placeholder="🔍 Search item or category…" style="width:100%;margin-top:10px;" oninput="filterMenuSearch()">
    <div id="manageMenuList" style="margin-top:12px;">Loading…</div>
  </div>

  <div class="card" id="dailySummaryCard" style="display:none;">
    <div class="section-title">Daily Summary</div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px;">
      <input type="date" id="summaryDate" style="width:160px;">
      <button onclick="loadDailySummary()">View</button>
    </div>
    <div id="dailySummaryBody">Pick a date and tap View.</div>
  </div>

  <div class="card" id="staffPerfCard" style="display:none;">
    <div class="section-title">Staff Performance</div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px;">
      <input type="date" id="staffPerfFrom" style="width:150px;">
      <input type="date" id="staffPerfTo" style="width:150px;">
      <button onclick="loadStaffPerformance()">View</button>
    </div>
    <div id="staffPerfBody">Pick a date range and tap View.</div>
  </div>

  <div class="layout">
    <!-- MENU -->
    <div class="card">
      <div class="section-title">Menu</div>
      <div id="menuWrap">Select a table to start ordering.</div>
    </div>

    <!-- CURRENT ORDER -->
    <div class="card">
      <div class="section-title" id="orderTitle">Order</div>
      <div id="orderWrap"><div class="empty-hint">No table selected.</div></div>
    </div>
  </div>

</div>

<script src="./bar-offline.js"></script>
<script>
const BASE = window.location.origin;
let selectedTable = null;   // full table row
let currentOrder = null;    // full order row (with items[])
let menuItems = [];
let _menuStockItems = [];
let _allTables = [];

function authHeaders() {
  const token = localStorage.getItem('mv_token');
  return { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + (token || '') };
}

// A real network failure (offline, DNS, dropped connection) makes fetch()
// itself throw a TypeError. A server that responded but rejected the
// request (403 locked, 409 conflict, etc.) throws a normal Error with the
// server's message via api() below — those must NOT be treated as "go
// offline", or a real validation error would silently vanish into the
// sync queue instead of being shown to the user.
class OfflineError extends Error {}

async function apiOrOffline(path, opts) {
  try {
    return await api(path, opts);
  } catch (e) {
    if (e.message === 'locked') throw e;
    if (e instanceof TypeError || !navigator.onLine) throw new OfflineError(e.message);
    throw e;
  }
}

function requireAuth() {
  const token = localStorage.getItem('mv_token');
  const el = document.getElementById('authMsg');
  if (!token) {
    el.innerHTML = '<div class="msg">Not logged in. <a class="login-link" href="./app.html">Log in to MedVault</a>, then come back to this page.</div>';
    return false;
  }
  el.innerHTML = '';
  return true;
}

function showLocked(errorMsg) {
  document.getElementById('content').style.display = 'none';
  document.getElementById('authMsg').innerHTML =
    `<div class="msg locked">🔒 ${errorMsg || 'This module is not included in your subscription.'} Contact MedVault to add the Bar module.</div>`;
}

async function api(path, opts) {
  const r = await fetch(BASE + path, { headers: authHeaders(), ...(opts || {}) });
  if (r.status === 403) {
    const d = await r.json().catch(() => ({}));
    if (d.code === 'MODULE_NOT_ENABLED') { showLocked(d.error); throw new Error('locked'); }
  }
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || ('Request failed (' + r.status + ')'));
  return d;
}

// ── TABLES ──────────────────────────────────────────────
function renderTablesGrid(tables) {
  const grid = document.getElementById('tablesGrid');
  document.getElementById('content').style.display = 'block';
  if (!tables.length) { grid.innerHTML = '<div class="empty-hint">No tables yet — add one below.</div>'; return; }
  grid.innerHTML = tables.map(t => `
    <div class="table-tile ${selectedTable && selectedTable.id === t.id ? 'selected' : ''}" onclick="selectTable('${t.id}')">
      <div class="num">#${t.table_number}${t._offline ? ' 📴' : ''}</div>
      <div class="cap">${t.capacity} seats</div>
      <div class="status ${t.status}">${t.status}</div>
    </div>
  `).join('');
}

async function loadTables() {
  const grid = document.getElementById('tablesGrid');
  try {
    const d = await apiOrOffline('/api/bar/tables');
    const tables = d.tables || []; _allTables = tables;
    BarOffline.cacheTables(tables);
    renderTablesGrid(tables);
  } catch (e) {
    if (e.message === 'locked') return;
    if (e instanceof OfflineError) {
      renderTablesGrid(BarOffline.getCachedTables());
    } else {
      grid.innerHTML = '<div class="msg bad">Failed to load tables.</div>';
    }
  }
}

async function createTable() {
  const num = document.getElementById('newTableNum').value.trim();
  const cap = parseInt(document.getElementById('newTableCap').value) || 4;
  if (!num) return alert('Enter a table number.');
  try {
    await apiOrOffline('/api/bar/tables', { method: 'POST', body: JSON.stringify({ table_number: num, capacity: cap }) });
  } catch (e) {
    if (e.message === 'locked') return;
    if (e instanceof OfflineError) {
      BarOffline.createTableLocal(num, cap);
    } else {
      alert(e.message);
      return;
    }
  }
  document.getElementById('newTableNum').value = '';
  loadTables();
}

async function selectTable(tableId) {
  try {
    const d = await apiOrOffline('/api/bar/tables');
    selectedTable = (d.tables || []).find(t => String(t.id) === String(tableId)) || null;
    BarOffline.cacheTables(d.tables || []);
  } catch (e) {
    if (e instanceof OfflineError) {
      selectedTable = BarOffline.getCachedTables().find(t => String(t.id) === String(tableId)) || null;
    } else {
      return;
    }
  }
  await loadTables();
  await loadMenu();
  await findOrOpenOrder();
}

// ── MENU ────────────────────────────────────────────────
function renderMenu(wrap) {
  if (!menuItems.length) { wrap.innerHTML = '<div class="empty-hint">No menu items yet. Owners/managers can add some in "Manage Menu & Stock" above.</div>'; return; }
  const byCat = {};
  menuItems.forEach(m => { const c = m.category || 'Other'; (byCat[c] = byCat[c] || []).push(m); });
  wrap.innerHTML = Object.keys(byCat).sort().map(cat => `
    <div class="menu-cat">${cat}</div>
    ${byCat[cat].map(m => `
      <div class="menu-item">
        <div>
          <div class="name">${m.name}</div>
          <div class="price">UGX ${Number(m.price).toLocaleString()}
            ${m.quantity_on_hand != null && m.quantity_on_hand <= (m.low_stock_threshold || 0) ? `<span class="stock-low"> · low stock (${m.quantity_on_hand})</span>` : ''}
          </div>
        </div>
        <button onclick="addItem('${m.id}')" ${!currentOrder ? 'disabled' : ''}>Add</button>
      </div>
    `).join('')}
  `).join('');
}

async function loadMenu() {
  const wrap = document.getElementById('menuWrap');
  if (!selectedTable) { wrap.innerHTML = 'Select a table to start ordering.'; return; }
  try {
    const d = await apiOrOffline('/api/bar/menu-items');
    menuItems = d.items || [];
    BarOffline.cacheMenu(menuItems);
    renderMenu(wrap);
  } catch (e) {
    if (e.message === 'locked') return;
    if (e instanceof OfflineError) {
      menuItems = BarOffline.getCachedMenu();
      renderMenu(wrap);
    } else {
      wrap.innerHTML = '<div class="msg bad">Failed to load menu.</div>';
    }
  }
}

// ── MANAGE MENU & STOCK (owner/manager/super_admin — matches backend's
// bar-menu:write permission exactly, so a staff/cashier account simply
// never sees this card rather than seeing it and getting a 403). ──────
function getRole() {
  try {
    const u = JSON.parse(localStorage.getItem('mv_user') || 'null');
    return (u?.role || '').toString().trim().toLowerCase();
  } catch (e) { return ''; }
}
async function loadManageMenu() {
  const card = document.getElementById('manageMenuCard');
  if (!['owner', 'manager', 'super_admin'].includes(getRole())) { card.style.display = 'none'; return; }
  document.getElementById('dailySummaryCard').style.display = '';
  document.getElementById('staffPerfCard').style.display = '';
  card.style.display = '';
  const list = document.getElementById('manageMenuList');
  list.innerHTML = 'Loading…';
  try {
    const d = await api('/api/bar/menu-items');
    _menuStockItems = d.items || []; renderManageMenuList(_menuStockItems);
  } catch (e) {
    if (e.message === 'locked') return;
    list.innerHTML = '<div class="msg bad">Failed to load menu items.</div>';
  }
}
function renderManageMenuList(items) {
  const list = document.getElementById('manageMenuList');
  if (!items.length) { list.innerHTML = '<div class="empty-hint">No menu items yet — add one above.</div>'; return; }
  const byCat = {};
  items.forEach(m => { const c = m.category || 'Other'; (byCat[c] = byCat[c] || []).push(m); });
  list.innerHTML = Object.keys(byCat).sort().map(cat => `
    <div class="menu-cat">${cat}</div>
    ${byCat[cat].map(m => `
      <div class="menu-item">
        <div>
          <div class="name">${m.name}${m.active === false ? ' <span class="stock-low">(inactive)</span>' : ''}</div>
          <div class="price">UGX ${Number(m.price).toLocaleString()} · stock ${m.quantity_on_hand ?? 0}
            ${m.cost_price ? `<span style="color:var(--muted)"> · margin UGX ${(Number(m.price) - Number(m.cost_price)).toLocaleString()}</span>` : ''}
            ${m.quantity_on_hand != null && m.quantity_on_hand <= (m.low_stock_threshold || 0) ? '<span class="stock-low"> · low</span>' : ''}
          </div>
        </div>
        <div style="display:flex;gap:6px;">
          <button class="secondary" style="padding:6px 10px;" onclick="adjustStock('${m.id}',-1)">−</button>
          <button class="secondary" style="padding:6px 10px;" onclick="adjustStock('${m.id}',1)">+</button>
          <button class="secondary" style="padding:6px 10px;" onclick="toggleItemActive('${m.id}',${m.active === false})">${m.active === false ? 'Enable' : 'Disable'}</button>
          <button class="secondary" style="padding:6px 10px;" onclick="startEditItem('${m.id}')">Edit</button>
        </div>
      </div>
    `).join('')}
  `).join('');
}
function filterMenuSearch() {
  const q = document.getElementById('menuStockSearch').value.trim().toLowerCase();
  if (!q) { renderManageMenuList(_menuStockItems); return; }
  const filtered = _menuStockItems.filter(m =>
    (m.name || '').toLowerCase().includes(q) || (m.category || '').toLowerCase().includes(q)
  );
  renderManageMenuList(filtered);
}
async function loadDailySummary() {
  const dateInput = document.getElementById('summaryDate');
  const dateStr = dateInput.value || new Date().toISOString().slice(0,10);
  const from = dateStr + 'T00:00:00';
  const to = dateStr + 'T23:59:59';
  const body = document.getElementById('dailySummaryBody');
  body.innerHTML = 'Loading…';
  try {
    const d = await api('/api/bar/reports/summary?from=' + encodeURIComponent(from) + '&to=' + encodeURIComponent(to));
    renderDailySummary(d);
  } catch (e) {
    body.innerHTML = '<div class="msg bad">Failed to load summary: ' + (e.message || 'unknown error') + '</div>';
  }
}
function renderDailySummary(d) {
  const body = document.getElementById('dailySummaryBody');
  const s = d.summary || {};
  const methods = (d.payment_methods || []).map(m =>
    `<div class="menu-item"><span>${m.method}</span><span>UGX ${Number(m.total).toLocaleString()} (${m.count})</span></div>`
  ).join('') || '<div class="empty-hint">No payments in this range.</div>';
  const items = (d.top_items || []).map(i =>
    `<div class="menu-item"><span>${i.item_name}</span><span>${i.quantity_sold} sold · UGX ${Number(i.revenue).toLocaleString()}</span></div>`
  ).join('') || '<div class="empty-hint">No sales in this range.</div>';
  const open = d.open_orders || {};
  const disc = d.discounts || {};
  const vo = d.voids || {};
  body.innerHTML = `
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:14px;">
      <div class="stat-card g"><div class="sl">Revenue</div><div class="sv">UGX ${Number(s.revenue||0).toLocaleString()}</div></div>
      <div class="stat-card b"><div class="sl">Paid Orders</div><div class="sv">${s.paid_orders||0}</div></div>
      <div class="stat-card w"><div class="sl">Avg Order</div><div class="sv">UGX ${Math.round(Number(s.avg_order_value||0)).toLocaleString()}</div></div>
    </div>
    <div class="menu-cat">Payment Methods</div>${methods}
    <div class="menu-cat">Top Items</div>${items}
    <div class="menu-cat">Open Tables (unpaid)</div>
    <div class="menu-item"><span>${open.open_orders||0} open</span><span>UGX ${Number(open.open_value||0).toLocaleString()} tied up</span></div>
    <div class="menu-cat">Discounts &amp; Voids</div>
    <div class="menu-item"><span>${disc.discounted_orders||0} discounted orders</span><span>UGX ${Number(disc.total_discounted||0).toLocaleString()}</span></div>
    <div class="menu-item"><span>${vo.voided_items||0} voided items</span><span>UGX ${Number(vo.voided_value||0).toLocaleString()}</span></div>
  `;
}
async function loadStaffPerformance() {
  const fromInput = document.getElementById('staffPerfFrom');
  const toInput = document.getElementById('staffPerfTo');
  const today = new Date().toISOString().slice(0,10);
  const fromStr = fromInput.value || today;
  const toStr = toInput.value || today;
  const from = fromStr + 'T00:00:00';
  const to = toStr + 'T23:59:59';
  const body = document.getElementById('staffPerfBody');
  body.innerHTML = 'Loading…';
  try {
    const d = await api('/api/bar/reports/staff?from=' + encodeURIComponent(from) + '&to=' + encodeURIComponent(to));
    renderStaffPerformance(d);
  } catch (e) {
    body.innerHTML = '<div class="msg bad">Failed to load staff performance: ' + (e.message || 'unknown error') + '</div>';
  }
}
function renderStaffPerformance(d) {
  const body = document.getElementById('staffPerfBody');
  const staff = d.staff || [];
  if (!staff.length) { body.innerHTML = '<div class="empty-hint">No staff activity in this range.</div>'; return; }
  body.innerHTML = staff.map(s => `
    <div class="menu-item" style="align-items:flex-start;">
      <div>
        <div class="name">${s.staff_name || 'Unknown'}</div>
        <div class="price">${s.orders_opened||0} orders opened · ${s.payments_taken||0} payments taken${s.void_count ? ` · <span class="stock-low">${s.void_count} voids (UGX ${Number(s.void_value).toLocaleString()})</span>` : ''}</div>
      </div>
      <div style="font-weight:700;">UGX ${Number(s.revenue_collected||0).toLocaleString()}</div>
    </div>
  `).join('');
}
let _editingItemId = null;
function startEditItem(id) {
  const item = _menuStockItems.find(m => String(m.id) === String(id));
  if (!item) return;
  _editingItemId = id;
  document.getElementById('newItemName').value = item.name || '';
  document.getElementById('newItemCategory').value = item.category || '';
  document.getElementById('newItemPrice').value = item.price || '';
  document.getElementById('newItemUnit').value = item.unit || '';
  document.getElementById('newItemCostPrice').value = item.cost_price || '';
  document.getElementById('newItemSupplier').value = item.supplier || '';
  const btn = document.getElementById('menuItemSubmitBtn');
  if (btn) btn.textContent = '✅ Save Changes';
  document.getElementById('newItemName').scrollIntoView({ behavior: 'smooth', block: 'center' });
}
function resetItemForm() {
  _editingItemId = null;
  document.getElementById('newItemName').value = '';
  document.getElementById('newItemCategory').value = '';
  document.getElementById('newItemPrice').value = '';
  document.getElementById('newItemUnit').value = '';
  document.getElementById('newItemCostPrice').value = '';
  document.getElementById('newItemSupplier').value = '';
  document.getElementById('newItemStock').value = '0';
  document.getElementById('newItemLowThreshold').value = '0';
  const btn = document.getElementById('menuItemSubmitBtn');
  if (btn) btn.textContent = '+ Add item';
}
async function createMenuItem() {
  const name = document.getElementById('newItemName').value.trim();
  const category = document.getElementById('newItemCategory').value.trim();
  const price = Number(document.getElementById('newItemPrice').value);
  const initial_quantity = Number(document.getElementById('newItemStock').value || 0);
  const low_stock_threshold = Number(document.getElementById('newItemLowThreshold').value || 0);
  const unit = document.getElementById('newItemUnit').value;
  const cost_price = Number(document.getElementById('newItemCostPrice').value || 0) || null;
  const supplier = document.getElementById('newItemSupplier').value.trim() || null;
  if (!name) return alert('Item name is required.');
  if (!price || price <= 0) return alert('Enter a valid price.');
  try {
    if (_editingItemId) {
      await api('/api/bar/menu-items/' + _editingItemId, { method: 'PATCH', body: JSON.stringify({ name, category, price, unit, cost_price, supplier }) });
    } else {
      await api('/api/bar/menu-items', { method: 'POST', body: JSON.stringify({ name, category, price, unit, cost_price, supplier, initial_quantity, low_stock_threshold }) });
    }
    resetItemForm();
    await loadManageMenu();
    if (selectedTable) loadMenu();
  } catch (e) {
    if (e.message !== 'locked') alert(e.message || 'Failed to save item.');
  }
}
async function adjustStock(menuItemId, delta) {
  try {
    await api('/api/bar/stock/' + menuItemId, { method: 'PATCH', body: JSON.stringify({ adjustment: delta }) });
    await loadManageMenu();
    if (selectedTable) loadMenu();
  } catch (e) {
    if (e.message !== 'locked') alert(e.message || 'Failed to adjust stock.');
  }
}
async function toggleItemActive(menuItemId, makeActive) {
  try {
    await api('/api/bar/menu-items/' + menuItemId, { method: 'PATCH', body: JSON.stringify({ active: makeActive }) });
    await loadManageMenu();
    if (selectedTable) loadMenu();
  } catch (e) {
    if (e.message !== 'locked') alert(e.message || 'Failed to update item.');
  }
}

// ── ORDER (per table) ────────────────────────────────────
async function findOrOpenOrder() {
  const wrap = document.getElementById('orderWrap');
  document.getElementById('orderTitle').textContent = 'Order — Table #' + selectedTable.table_number;
  wrap.innerHTML = 'Loading…';
  try {
    const d = await apiOrOffline('/api/bar/orders?status=open');
    const existing = (d.orders || []).find(o => String(o.table_id) === String(selectedTable.id));
    if (existing) {
      currentOrder = existing;
      const pd = await apiOrOffline('/api/bar/orders/' + currentOrder.id + '/payments');
      payments = pd.payments || [];
    } else {
      const created = await apiOrOffline('/api/bar/orders', { method: 'POST', body: JSON.stringify({ table_id: selectedTable.id }) });
      currentOrder = { ...created.order, items: [] };
      payments = [];
    }
    renderOrder();
    loadMenu(); // re-render so Add buttons enable
  } catch (e) {
    if (e.message === 'locked') return;
    if (e instanceof OfflineError) {
      // Reuse a not-yet-synced local order for this table if one exists,
      // otherwise start a brand new one entirely on-device.
      currentOrder = BarOffline.findOpenLocalOrderForTable(selectedTable.id) || BarOffline.createOrderLocal(selectedTable.id);
      payments = (currentOrder.payments || []);
      renderOrder();
      loadMenu();
      return;
    }
    wrap.innerHTML = '<div class="msg bad">Failed to open order for this table.</div>';
  }
}

let payments = []; // payments already recorded against currentOrder

function renderOrder() {
  const wrap = document.getElementById('orderWrap');
  if (!currentOrder) { wrap.innerHTML = '<div class="empty-hint">No table selected.</div>'; return; }
  const items = currentOrder.items || [];
  const total = Number(currentOrder.total_amount || 0);
  const paid = Number(currentOrder.paid_amount || 0);
  const balance = currentOrder.balance_due != null ? Number(currentOrder.balance_due) : (total - paid);

  wrap.innerHTML = `
    ${currentOrder._offline ? '<div class="msg">📴 Saved on this device — will sync once you\'re back online.</div>' : ''}
    ${items.length ? items.map(i => `
      <div class="order-line">
        <span><span class="qty">${i.quantity}×</span>${i.item_name}${i._offline ? ' 📴' : ''}</span>
        <span>UGX ${(i.quantity * i.unit_price).toLocaleString()}</span>
      </div>
    `).join('') : '<div class="empty-hint">No items added yet.</div>'}
    <div class="total-row"><span>Total</span><span>UGX ${total.toLocaleString()}</span></div>
    ${paid > 0 ? `
      <div class="balance-row"><span>Paid so far</span><span>UGX ${paid.toLocaleString()}</span></div>
      <div class="balance-row due"><span>Balance due</span><span>UGX ${balance.toLocaleString()}</span></div>
    ` : ''}
    ${payments.length ? `<div class="paid-list">${payments.map(p => `
      <div class="row"><span>${p.method.replace('_',' ')}${p.reference ? ' · ' + p.reference : ''}</span><span>UGX ${Number(p.amount).toLocaleString()}</span></div>
    `).join('')}</div>` : ''}
    ${items.length ? `
      <div class="bar" style="margin-top:12px;">
        <button class="secondary" onclick="printBarReceipt()">🖨️ Print Receipt</button>
        <button class="secondary" onclick="openTransferModal()">🔀 Transfer Table</button>
      </div>
    ` : ''}

    ${items.length && balance > 0 ? `
      <div class="pay-panel">
        <div style="display:flex;gap:8px;align-items:center;margin-bottom:10px;">
          <label style="font-size:12px;color:var(--muted);">Split evenly
            <input type="number" id="splitWays" min="1" step="1" placeholder="e.g. 3" style="width:70px;margin-left:6px;">
          </label>
          <button class="secondary" style="padding:6px 10px;" onclick="applySplit()">Calculate share</button>
        </div>
        <div class="formgrid">
          <label>Method
            <select id="pay_method" onchange="onPayMethodChange()">
              <option value="cash">Cash</option>
              <option value="mobile_money">Mobile money</option>
              <option value="card">Card</option>
              <option value="other">Other</option>
            </select>
          </label>
          <label>Amount
            <input type="number" id="pay_amount" value="${balance}" min="0.01" step="0.01" max="${balance}">
          </label>
          <label id="pay_tendered_wrap">Cash tendered
            <input type="number" id="pay_tendered" placeholder="e.g. amount handed over" min="0" step="0.01" oninput="updateChangeNote()">
          </label>
          <label>Reference <input id="pay_reference" placeholder="optional — txn ID"></label>
        </div>
        <div class="change-note" id="changeNote"></div>
        <div id="payMsg"></div>
        <div class="bar">
          <button onclick="recordPayment()">Record payment</button>
        </div>
      </div>
    ` : ''}
    ${!items.length ? `
      <div class="bar" style="margin-top:14px;">
        <button class="secondary" onclick="voidOrder()">Cancel / void table</button>
      </div>
    ` : ''}
  `;
}

function applySplit() {
  const ways = parseInt(document.getElementById('splitWays').value);
  if (!ways || ways < 1) return alert('Enter how many people are splitting the bill.');
  const balance = currentOrder.balance_due != null ? Number(currentOrder.balance_due) : 0;
  const share = Math.ceil((balance / ways) * 100) / 100;
  document.getElementById('pay_amount').value = share;
}
function onPayMethodChange() {
  const method = document.getElementById('pay_method').value;
  document.getElementById('pay_tendered_wrap').style.display = method === 'cash' ? 'flex' : 'none';
  updateChangeNote();
}

function updateChangeNote() {
  const method = document.getElementById('pay_method')?.value;
  const note = document.getElementById('changeNote');
  if (!note) return;
  if (method !== 'cash') { note.textContent = ''; return; }
  const amount = parseFloat(document.getElementById('pay_amount').value) || 0;
  const tendered = parseFloat(document.getElementById('pay_tendered').value);
  if (!isNaN(tendered) && tendered >= amount) {
    note.textContent = 'Change due: UGX ' + (tendered - amount).toLocaleString();
  } else {
    note.textContent = '';
  }
}

async function addItem(menuItemId) {
  if (!currentOrder) return;
  const menuItem = menuItems.find(m => String(m.id) === String(menuItemId));

  // Order was already created locally (not yet synced) — go straight to
  // the local path rather than hitting an order id the server doesn't
  // know about yet.
  if (currentOrder._offline) {
    BarOffline.addItemLocal(currentOrder, menuItem, 1);
    renderOrder();
    loadMenu();
    return;
  }

  try {
    await apiOrOffline('/api/bar/orders/' + currentOrder.id + '/items', {
      method: 'POST',
      body: JSON.stringify({ menu_item_id: menuItemId, quantity: 1 })
    });
    // Refresh order + menu (stock counts change)
    const d = await apiOrOffline('/api/bar/orders?status=open');
    currentOrder = (d.orders || []).find(o => o.id === currentOrder.id) || currentOrder;
    renderOrder();
    loadMenu();
  } catch (e) {
    if (e.message === 'locked') return;
    if (e instanceof OfflineError) {
      BarOffline.addItemLocal(currentOrder, menuItem, 1);
      renderOrder();
      loadMenu();
      return;
    }
    alert(e.message);
  }
}

async function recordPayment() {
  if (!currentOrder) return;
  const msg = document.getElementById('payMsg');
  const method = document.getElementById('pay_method').value;
  const amount = parseFloat(document.getElementById('pay_amount').value);
  const tendered = document.getElementById('pay_tendered').value;
  const reference = document.getElementById('pay_reference').value;
  if (!amount || amount <= 0) { msg.innerHTML = '<div class="msg bad">Enter a valid amount.</div>'; return; }
  msg.innerHTML = 'Recording…';
  const body = { method, amount, reference: reference || null };
  if (method === 'cash' && tendered) body.tendered = parseFloat(tendered);

  if (currentOrder._offline) {
    const payment = BarOffline.recordPaymentLocal(currentOrder, body);
    payments.push(payment);
  } else {
    try {
      const d = await apiOrOffline('/api/bar/orders/' + currentOrder.id + '/payments', { method: 'POST', body: JSON.stringify(body) });
      currentOrder = d.order;
      payments.push(d.payment);
    } catch (e) {
      if (e.message === 'locked') return;
      if (e instanceof OfflineError) {
        const payment = BarOffline.recordPaymentLocal(currentOrder, body);
        payments.push(payment);
      } else {
        msg.innerHTML = '<div class="msg bad">' + e.message + '</div>';
        return;
      }
    }
  }

  {
    if (currentOrder.status === 'paid') {
      msg.innerHTML = '';
      // Fully settled — clear the table selection and go back to the floor plan.
      setTimeout(() => {
        currentOrder = null; selectedTable = null; payments = [];
        document.getElementById('orderTitle').textContent = 'Order';
        document.getElementById('orderWrap').innerHTML = '<div class="empty-hint">No table selected.</div>';
        document.getElementById('menuWrap').innerHTML = 'Select a table to start ordering.';
        loadTables();
      }, 500);
      wrap_settled_message();
    } else {
      renderOrder();
      loadMenu();
    }
  }
}

function wrap_settled_message() {
  document.getElementById('orderWrap').innerHTML = '<div class="msg good">Bill fully settled — table freed.</div>';
}

function openTransferModal() {
  if (!currentOrder) return;
  const available = _allTables.filter(t => t.status !== 'occupied' || String(t.id) === String(currentOrder.table_id));
  if (!available.length) return alert('No other tables available to transfer to.');
  const list = available.map(t => `${t.table_number} (${t.status})`).join('\n');
  const choice = prompt('Enter the table number to transfer this order to:\n\nAvailable: ' + available.map(t => t.table_number).join(', '));
  if (!choice) return;
  const target = available.find(t => String(t.table_number).trim() === choice.trim());
  if (!target) return alert('Table "' + choice + '" not found or not available.');
  confirmTransfer(target.id);
}
async function confirmTransfer(newTableId) {
  try {
    await api('/api/bar/orders/' + currentOrder.id + '/transfer', { method: 'PATCH', body: JSON.stringify({ new_table_id: newTableId }) });
    await loadTables();
    await selectTable(newTableId);
  } catch (e) {
    alert(e.message || 'Failed to transfer table.');
  }
}
async function voidOrder() {
  if (!currentOrder) return;
  if (!confirm('Cancel this table with no charges? This cannot be undone.')) return;

  if (currentOrder._offline) {
    BarOffline.voidOrderLocal(currentOrder);
  } else {
    try {
      await apiOrOffline('/api/bar/orders/' + currentOrder.id + '/close', { method: 'POST', body: JSON.stringify({}) });
    } catch (e) {
      if (e.message === 'locked') return;
      if (e instanceof OfflineError) {
        BarOffline.voidOrderLocal(currentOrder);
      } else {
        alert(e.message);
        return;
      }
    }
  }

  currentOrder = null;
  selectedTable = null;
  payments = [];
  document.getElementById('orderTitle').textContent = 'Order';
  document.getElementById('orderWrap').innerHTML = '<div class="empty-hint">No table selected.</div>';
  document.getElementById('menuWrap').innerHTML = 'Select a table to start ordering.';
  loadTables();
}

// ── RECEIPT PRINTING ────────────────────────────────────
// Mirrors app.html's printRcpt(): a popup window styled with the same
// r-prefixed classes, so pharmacy and bar receipts look consistent, then
// auto-triggers the browser print dialog and closes itself after.
function printBarReceipt() {
  if (!currentOrder) return;
  const items = currentOrder.items || [];
  const total = Number(currentOrder.total_amount || 0);
  const discount = Number(currentOrder.discount_amount || 0);
  const subtotal = total + discount;
  const paidTotal = payments.reduce((s, p) => s + Number(p.amount || 0), 0);
  const tableLabel = selectedTable ? 'Table #' + selectedTable.table_number : '';
  const itemsHtml = items.map(i => `
    <div class="ri" style="display:grid;grid-template-columns:2fr 1fr 1fr;font-size:12px;padding:4px 0;border-bottom:1px solid #f0f0f0;">
      <span>${i.item_name}</span><span style="text-align:center">${i.quantity}</span><span style="text-align:right">${(i.quantity * i.unit_price).toLocaleString()}</span>
    </div>
  `).join('');
  const paymentsHtml = payments.map(p => `
    <div class="rtr" style="display:flex;justify-content:space-between;font-size:12px;padding:3px 0;"><span>${p.method.replace('_',' ')}</span><span>UGX ${Number(p.amount).toLocaleString()}</span></div>
  `).join('');
  const content = `
    <div class="rtop" style="text-align:center;margin-bottom:14px;"><div class="rlogo" style="font-family:'Syne',sans-serif;font-weight:800;font-size:20px;">🍺 MedVault Bar</div><div class="raddr" style="font-size:11px;color:#666;">${tableLabel}</div></div>
    <hr class="rdiv" style="border:none;border-top:1px dashed #ccc;margin:12px 0;"/>
    <div class="rmr" style="display:flex;justify-content:space-between;font-size:11px;color:#666;margin-bottom:7px;"><span>Order #${currentOrder.id}</span><span>${new Date(currentOrder.opened_at || Date.now()).toLocaleString()}</span></div>
    <hr class="rdiv" style="border:none;border-top:1px dashed #ccc;margin:12px 0;"/>
    <div class="rih" style="display:grid;grid-template-columns:2fr 1fr 1fr;font-size:10px;color:#999;text-transform:uppercase;margin-bottom:6px;"><span>Item</span><span style="text-align:center">Qty</span><span style="text-align:right">Total</span></div>
    ${itemsHtml}
    <div style="margin-top:10px">
      <div class="rtr" style="display:flex;justify-content:space-between;font-size:12px;padding:3px 0;"><span>Subtotal</span><span>UGX ${subtotal.toLocaleString()}</span></div>
      ${discount > 0 ? `<div class="rtr" style="display:flex;justify-content:space-between;font-size:12px;padding:3px 0;"><span>Discount</span><span>-UGX ${discount.toLocaleString()}</span></div>` : ''}
      <div class="rtr rgrand" style="display:flex;justify-content:space-between;font-family:'Syne',sans-serif;font-weight:800;font-size:15px;border-top:2px solid #111;margin-top:5px;padding-top:6px;"><span>TOTAL</span><span>UGX ${total.toLocaleString()}</span></div>
      ${paymentsHtml}
      ${paidTotal < total ? `<div class="rtr" style="display:flex;justify-content:space-between;font-size:12px;padding:3px 0;color:#e74c3c;"><span>Balance due</span><span>UGX ${(total - paidTotal).toLocaleString()}</span></div>` : ''}
    </div>
    <div class="rfooter" style="text-align:center;margin-top:12px;padding-top:12px;border-top:1px dashed #ccc;font-size:11px;color:#888;line-height:1.7;">Thank you — see you again soon!<br><strong>MedVault</strong> · medvault.ug</div>
  `;
  const w = window.open('', '_blank');
  w.document.write(`<html><head><title>Receipt</title><meta name="viewport" content="width=device-width, initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Syne:wght@800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet"><style>body{font-family:'DM Sans',sans-serif;padding:20px;max-width:320px;margin:0 auto;color:#111}</style></head><body>${content}
<script>window.onload=()=>window.print()<\/script>
</body></html>`);
  w.document.close();
}

// ─── Init ───
const BASE_TOKEN = localStorage.getItem('mv_token');
if (requireAuth()) {
  loadTables();
  loadManageMenu();
  document.getElementById('summaryDate').value = new Date().toISOString().slice(0,10);
  document.getElementById('staffPerfFrom').value = new Date().toISOString().slice(0,10);
  document.getElementById('staffPerfTo').value = new Date().toISOString().slice(0,10);
  BarOffline.init(BASE, BASE_TOKEN);
  // After a background sync pushes queued changes, refresh whatever's on
  // screen so offline tags disappear and real server ids take over.
  window.onBarSynced = () => {
    loadTables();
    if (selectedTable) loadMenu();
    if (currentOrder && !currentOrder._offline) findOrOpenOrder();
  };
}
</script>
